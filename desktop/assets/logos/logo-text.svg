<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo pequeno -->
  <g transform="translate(10, 10) scale(0.4)">
    <rect x="85" y="160" width="30" height="8" rx="4" fill="url(#textGrad)"/>
    <rect x="98" y="60" width="4" height="100" rx="2" fill="url(#textGrad)"/>
    <rect x="40" y="60" width="120" height="6" rx="3" fill="url(#textGrad)"/>
    <circle cx="60" cy="50" r="3" fill="url(#textGrad)"/>
    <path d="M 40 70 Q 60 80 80 70" stroke="url(#textGrad)" stroke-width="3" fill="none"/>
    <ellipse cx="60" cy="70" rx="22" ry="8" fill="url(#textGrad)" opacity="0.6"/>
    <circle cx="140" cy="50" r="3" fill="url(#textGrad)"/>
    <path d="M 120 70 Q 140 80 160 70" stroke="url(#textGrad)" stroke-width="3" fill="none"/>
    <ellipse cx="140" cy="70" rx="22" ry="8" fill="url(#textGrad)" opacity="0.6"/>
  </g>

  <!-- Texto -->
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#textGrad)">
    JustoBot
  </text>
  <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8" opacity="0.8">
    Sistema de Consulta Jurídica
