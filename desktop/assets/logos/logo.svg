<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Símbolo da Justiça -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Balança da Justiça Moderna -->
  <g filter="url(#glow)">
    <!-- Base -->
    <rect x="85" y="160" width="30" height="8" rx="4" fill="url(#grad1)"/>

    <!-- Haste central -->
    <rect x="98" y="60" width="4" height="100" rx="2" fill="url(#grad1)"/>

    <!-- Barra horizontal -->
    <rect x="40" y="60" width="120" height="6" rx="3" fill="url(#grad1)"/>

    <!-- Prato esquerdo -->
    <circle cx="60" cy="50" r="3" fill="url(#grad1)"/>
    <path d="M 40 70 Q 60 80 80 70" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <ellipse cx="60" cy="70" rx="22" ry="8" fill="url(#grad1)" opacity="0.6"/>

    <!-- Prato direito -->
    <circle cx="140" cy="50" r="3" fill="url(#grad1)"/>
    <path d="M 120 70 Q 140 80 160 70" stroke="url(#grad1)" stroke-width="3" fill="none"/>
    <ellipse cx="140" cy="70" rx="22" ry="8" fill="url(#grad1)" opacity="0.6"/>

    <!-- Detalhes de tecnologia -->
    <circle cx="100" cy="40" r="12" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.8"/>
    <circle cx="100" cy="40" r="6" fill="url(#grad1)" opacity="0.6"/>

    <!-- Linhas de circuito -->
    <path d="M 60 90 L 70 100" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <path d="M 140 90 L 130 100" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
    <circle cx="70" cy="100" r="2" fill="url(#grad1)" opacity="0.6"/>
    <circle cx="130" cy="100" r="2" fill="url(#grad1)" opacity="0.6"/>
  </g>

  <!-- Anel externo -->
  <circle cx="100" cy="100" r="90" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="100" cy="100" r="95" stroke="url(#grad1)" stroke-width="1" fill="none" opacity="0.2"/>
</svg>
